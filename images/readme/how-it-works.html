<!doctype html>
<!-- Source of how-it-works.png. Re-render (Windows):
     "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars
       --window-size=1600,600 --screenshot=how-it-works.png how-it-works.html -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #0d1424; }
  svg { display: block; font-family: "Segoe UI", system-ui, sans-serif; }
  .box { fill: #172036; stroke: #2c3a57; stroke-width: 2; }
  .aria { fill: #13283f; stroke: #38bdf8; stroke-width: 3; }
  .title { fill: #f1f5f9; font-size: 26px; font-weight: 600; }
  .sub { fill: #94a3b8; font-size: 18px; }
  .label { fill: #cbd5e1; font-size: 17px; }
  .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .hot { stroke: #38bdf8; }
  .step { fill: #38bdf8; font-size: 16px; font-weight: 700; }
</style></head><body>
<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- CLI agent -->
  <rect class="box" x="50" y="235" width="320" height="130" rx="16"/>
  <text class="title" x="210" y="290" text-anchor="middle">CLI agent</text>
  <text class="sub" x="210" y="322" text-anchor="middle">Claude Code · Codex · OpenCode</text>
  <text class="sub" x="210" y="346" text-anchor="middle">Cursor · Copilot · Gemini</text>

  <!-- File on disk -->
  <rect class="box" x="530" y="80" width="300" height="110" rx="16"/>
  <text class="title" x="680" y="128" text-anchor="middle">Your file</text>
  <text class="sub" x="680" y="160" text-anchor="middle">edited on disk</text>

  <!-- Event log -->
  <rect class="box" x="530" y="410" width="300" height="120" rx="16"/>
  <text class="title" x="680" y="458" text-anchor="middle">Hook event log</text>
  <text class="sub" x="680" y="490" text-anchor="middle">~/.aria · path, time, agent</text>

  <!-- Baseline -->
  <rect class="box" x="970" y="40" width="290" height="110" rx="16"/>
  <text class="title" x="1115" y="88" text-anchor="middle">Baseline snapshot</text>
  <text class="sub" x="1115" y="120" text-anchor="middle">taken when the folder opens</text>

  <!-- ARIA -->
  <rect class="aria" x="970" y="235" width="290" height="130" rx="16"/>
  <text class="title" x="1115" y="290" text-anchor="middle">ARIA in VS Code</text>
  <text class="sub" x="1115" y="322" text-anchor="middle">compares file with baseline</text>
  <text class="sub" x="1115" y="346" text-anchor="middle">(VS Code's diff algorithm)</text>

  <!-- Result -->
  <rect class="box" x="1340" y="220" width="220" height="160" rx="16"/>
  <text class="title" x="1450" y="262" text-anchor="middle">Inline diff</text>
  <rect x="1365" y="280" width="170" height="18" rx="4" fill="#f87171" fill-opacity=".55"/>
  <rect x="1365" y="304" width="170" height="18" rx="4" fill="#34d399" fill-opacity=".55"/>
  <text x="1450" y="355" text-anchor="middle" font-size="18" font-weight="600"><tspan fill="#34d399">✓ Accept</tspan><tspan fill="#94a3b8">  ·  </tspan><tspan fill="#f87171">✕ Reject</tspan></text>

  <!-- Arrows -->
  <path class="line" d="M370 270 C 450 220, 450 150, 525 140"/>
  <text class="label" x="400" y="180">edits</text>
  <path class="line" d="M370 330 C 450 380, 450 460, 525 465"/>
  <text class="label" x="215" y="420">hook reports path</text>
  <path class="line" d="M830 140 C 900 150, 910 250, 965 275"/>
  <path class="line" d="M830 470 C 900 460, 910 350, 965 325"/>
  <path class="line" d="M1115 150 L1115 230"/>
  <path class="line hot" style="marker-end:url(#arrowHot)" d="M1260 300 L1335 300"/>

  <!-- Step numbers -->
  <circle cx="1000" cy="40" r="16" fill="#0d1424" stroke="#38bdf8" stroke-width="2"/><text class="step" x="1000" y="46" text-anchor="middle">1</text>
  <circle cx="560" cy="410" r="16" fill="#0d1424" stroke="#38bdf8" stroke-width="2"/><text class="step" x="560" y="416" text-anchor="middle">2</text>
  <circle cx="1000" cy="235" r="16" fill="#0d1424" stroke="#38bdf8" stroke-width="2"/><text class="step" x="1000" y="241" text-anchor="middle">3</text>
  <circle cx="1370" cy="220" r="16" fill="#0d1424" stroke="#38bdf8" stroke-width="2"/><text class="step" x="1370" y="226" text-anchor="middle">4</text>
</svg>
</body></html>
